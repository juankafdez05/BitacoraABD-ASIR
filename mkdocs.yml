site_name: Bitácora ABD
site_description: "Laboratorio de Base de Datos · 2.º ASIR · IES Gonzalo Nazareno · Curso 2026/27"
site_url: https://juankafdez05.github.io/BitacoraABD-ASIR/
repo_url: https://github.com/juankafdez05/BitacoraABD-ASIR
repo_name: juankafdez05/BitacoraABD-ASIR
docs_dir: docs
site_dir: site
use_directory_urls: true

# El menú se genera solo desde docs/practicas/ (ver hooks/autonav.py). No hay "nav:" manual.
hooks:
  - hooks/autonav.py

# Excluir de la PUBLICACIÓN (distinto de excluir del menú). Nada de esto se copia al sitio.
exclude_docs: |
  .*
  *.bak
  *.orig
  *.swp
  *~
  *.env
  *.pem
  *.key
  *.crt
  *.pfx
  *.sql.gz
  *.zip
  *.tar
  *.tar.gz
  _borradores/

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

theme:
  name: material
  language: es
  custom_dir: overrides
  font: false            # tipografía del sistema: no se descarga nada de Google Fonts
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate        # un único tema oscuro, estilo terminal
    primary: custom
    accent: custom
  features:
    - navigation.indexes   # práctica y apartado tienen su propia página y se pliegan/despliegan
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - assets/extra.css

extra:
  generator: false
